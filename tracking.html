<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
/* Tokens bewusst identisch zum Signalpult: eine App-Familie, zwei Rollen. */
:root{
  color-scheme:light dark;
  --paper:#FAFAF7;--panel:#FFFFFF;--ink:#191C18;--muted:#6B7168;--faint:#9A9E94;
  --line:#E4E5DE;--line-strong:#CFD1C7;
  --recovery:#2E6F72;--recovery-soft:#E4F0EF;
  --load:#9A6B12;--load-soft:#F3EBD8;
  --pos:#3C7A33;--neg:#B23A2E;--neg-soft:#F6E3E0;
  --focus-bg:#F1F2EC;--accent2:#7A4FB0;--accent2-soft:#EFE8F7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14150F;--panel:#1C1E17;--ink:#ECEDE4;--muted:#9DA294;--faint:#71766A;--line:#2C2E25;--line-strong:#3A3D31;
  --recovery:#5FB3B4;--recovery-soft:#17322E;--load:#D9A54A;--load-soft:#332812;--pos:#6FB85F;--neg:#E4675A;--neg-soft:#3A1E1A;
  --focus-bg:#20221A;--accent2:#B79BE0;--accent2-soft:#241A33;}}
:root[data-theme="dark"]{
  --paper:#14150F;--panel:#1C1E17;--ink:#ECEDE4;--muted:#9DA294;--faint:#71766A;--line:#2C2E25;--line-strong:#3A3D31;
  --recovery:#5FB3B4;--recovery-soft:#17322E;--load:#D9A54A;--load-soft:#332812;--pos:#6FB85F;--neg:#E4675A;--neg-soft:#3A1E1A;
  --focus-bg:#20221A;--accent2:#B79BE0;--accent2-soft:#241A33;}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%;padding-bottom:84px}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 clamp(14px,4vw,24px)}
h1,h2,h3{margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--recovery);outline-offset:2px}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.brand{margin-right:auto;min-width:0}
.brand h1{font-size:18px;font-weight:700}
.brand .tag{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill.dirty{border-color:var(--load);color:var(--load);background:var(--load-soft)}
.pill.dirty .dot{background:var(--load)}
.pill.clean .dot{background:var(--recovery)}

/* Navigation unten (Daumenzone) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 6px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--recovery);background:var(--recovery-soft)}

/* Bausteine */
.viewhead{margin:18px 0 12px}
.viewhead h2{font-size:21px}
.viewhead .sub{font-size:13px;color:var(--muted);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px}
.lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.grouplab{font-size:12.5px;font-weight:700;color:var(--muted);margin:22px 2px 8px}
.row{display:flex;gap:10px;align-items:center}
.row.wrapok{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:9px;padding:10px 11px;font-size:16px;min-height:44px}
textarea{resize:vertical;min-height:64px}
input[type=number]{font-family:"IBM Plex Mono",ui-monospace,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--recovery);border-color:var(--recovery);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stack>*+*{margin-top:10px}

/* Skalen 1–5: große Treffer, Anker-Text darunter */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:48px;border:1px solid var(--line-strong);background:var(--paper);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px}
.scale button b{font-family:"IBM Plex Mono",monospace;font-size:17px}
.scale button span{font-size:10.5px;color:var(--muted);line-height:1.1;text-align:center}
.scale button[aria-pressed="true"]{background:var(--load);border-color:var(--load);color:#fff}
.scale button[aria-pressed="true"] span{color:#fff;opacity:.9}
.scale.vol button[aria-pressed="true"]{background:var(--recovery);border-color:var(--recovery)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--paper);border-radius:18px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid var(--line);background:transparent;padding:9px 8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--recovery-soft);color:var(--recovery)}

/* Listen */
.list{border:1px solid var(--line);border-radius:13px;background:var(--panel);overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;font-size:14px}
.li .s{font-size:12.5px;color:var(--muted)}
.li .v{font-family:"IBM Plex Mono",monospace;font-size:14px;white-space:nowrap}
.li button.x{border:0;background:none;color:var(--faint);font-size:18px;cursor:pointer;padding:4px 6px;min-width:34px;min-height:34px}
.li.tap{cursor:pointer}
.li.tap:hover{background:var(--focus-bg)}
.empty{text-align:center;padding:22px 16px;color:var(--muted);font-size:13.5px}
.empty .btn{margin-top:10px}

/* Plan / Ziele: Phase als Farbfläche — dieselbe Sprache wie im Signalpult */
.phase{display:inline-block;border-radius:6px;padding:3px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.phase.none{border:1px dashed var(--line-strong);color:var(--faint);font-weight:600}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .area{font-weight:700;font-size:14.5px}
.goal .dims{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.goal .dim{font-size:11px;color:var(--muted);font-weight:600;margin-right:2px}
.goal .note{grid-column:1/-1;font-size:13px;color:var(--ink);background:var(--focus-bg);border-radius:8px;padding:7px 10px;white-space:pre-wrap}
.goal .ist{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.goal .ist b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
.overall{border-left:4px solid var(--recovery);padding-left:12px}
.overall .ph{margin:4px 0 6px}
.overall .ph .phase{font-size:16px;padding:5px 12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600;margin-top:2px}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500}
.kpi .d{font-size:11.5px;color:var(--muted)}
.warn{color:var(--neg)}

/* Kraft */
.exc{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;background:var(--panel)}
.exc .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.exc .hd b{font-size:15px}
.exc .last{font-size:12px;color:var(--muted);margin-bottom:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 78px 34px;gap:6px;align-items:center;margin-bottom:6px}
.setrow .n{font-family:"IBM Plex Mono",monospace;color:var(--muted);text-align:center}
.setrow input,.setrow select{min-height:40px;padding:7px 8px;font-size:15px}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 78px 34px;gap:6px;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.catbadge{font-size:11px;font-weight:700;color:var(--load);background:var(--load-soft);border-radius:5px;padding:1px 7px}
.focusbadge{font-size:11px;font-weight:700;color:var(--accent2);background:var(--accent2-soft);border-radius:5px;padding:1px 7px}
details.fold{border:1px solid var(--line);border-radius:13px;background:var(--panel);margin-bottom:12px}
details.fold>summary{cursor:pointer;padding:13px 15px;font-weight:700;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";float:right;color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold .body{padding:0 15px 14px}

/* LSI-Zahl */
.lsi{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:600;line-height:1}
.lsi small{font-size:14px;color:var(--muted)}
.spark{width:100%;height:46px;display:block}

/* Tabelle Vertrag */
.tblwrap{overflow-x:auto}
table.contract{border-collapse:collapse;width:100%;font-size:12.5px}
table.contract td,table.contract th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.contract th{color:var(--muted);font-weight:600}
code{font-family:"IBM Plex Mono",monospace;font-size:.92em;background:var(--focus-bg);border-radius:4px;padding:1px 5px}

/* Modal + Toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,8,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--panel);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
@media (min-width:640px){.modal{border-radius:16px}}
.modal h3{font-size:17px;margin-bottom:8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Zusätze v2 (Training-Monitor-Logik) ---- */
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.subtabs button{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--panel);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);min-height:40px}
.subtabs button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.kwb{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:4px}
.fldlab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.fldlab i{font-style:normal;font-weight:400;color:var(--faint)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--paper);border-radius:10px;padding:9px 8px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:42px;color:var(--ink)}
.opt.g{background:var(--recovery);border-color:var(--recovery);color:#fff}
.opt.y{background:var(--load);border-color:var(--load);color:#fff}
.tchip{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px;white-space:nowrap}
.tchip.weighted{color:var(--recovery);background:var(--recovery-soft)}
.tchip.bodyweight{color:var(--load);background:var(--load-soft)}
.tchip.hold{color:var(--accent2);background:var(--accent2-soft)}
.strset{border-top:1px dashed var(--line);padding:8px 0 4px}
.strset:first-child{border-top:0}
.strrow{display:flex;align-items:center;gap:6px}
.strrow .n{width:20px;font-family:"IBM Plex Mono",monospace;color:var(--muted);text-align:center}
.strrow input{min-height:40px;padding:7px 8px;font-size:15px;width:74px;flex:0 0 auto}
.strrow .x2{font-size:12px;color:var(--muted)}
.strrow .eff{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-left:auto}
.rir{display:flex;align-items:center;gap:5px;margin:6px 0 0 26px}
.rir span{font-size:11px;color:var(--muted);font-weight:600;margin-right:2px}
.rir button{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;min-height:32px}
.rir button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.meta{font-size:12px;color:var(--muted)}
.pillb{display:inline-block;border-radius:6px;padding:1px 7px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600}
.pillb.g{background:var(--recovery-soft);color:var(--recovery)}
.pillb.y{background:var(--load-soft);color:var(--load)}
.pillb.r{background:var(--neg-soft);color:var(--neg)}
table.log{border-collapse:collapse;width:100%;font-size:13px}
table.log th{font-size:11px;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.log td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.log td.v{font-family:"IBM Plex Mono",monospace;white-space:nowrap}
table.log tr.det td{background:var(--focus-bg);font-size:12px;color:var(--muted);line-height:1.55}
.linky{color:var(--recovery);cursor:pointer;font-weight:600}
button.x{border:0;background:none;color:var(--faint);font-size:18px;cursor:pointer;min-width:32px;min-height:32px}
.ftag{padding:6px 12px;border-radius:14px;border:1px solid var(--line-strong);background:transparent;font-size:12.5px;cursor:pointer;color:var(--muted);min-height:34px}
.ftag.on{border-color:var(--recovery);background:var(--recovery-soft);color:var(--recovery);font-weight:600}
.ftag.add{border-style:dashed}
#toast .undo{margin-left:12px;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;pointer-events:auto}
#toast.on{pointer-events:auto}
.balance{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.wrow{padding:0;gap:0}
.wbox{flex:0 0 auto;width:30px;height:30px;margin:0 4px 0 14px;border-radius:8px;border:2px solid var(--line-strong);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;cursor:pointer;color:#fff}
.wbox.done{background:var(--recovery);border-color:var(--recovery);cursor:default}
.wbox.skip{background:var(--faint);border-color:var(--faint)}
.wgo{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:14px 14px 14px 10px;cursor:pointer;min-height:56px}
.wgo:hover{background:var(--focus-bg)}
.wgo .t{flex:1;font-weight:600;font-size:15px}
.wn{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--recovery);font-weight:600}
.wskip{font-size:13px;color:var(--muted);font-style:italic}
.wopen{font-size:13px;color:var(--load);font-weight:600}
.chev{color:var(--faint);font-size:18px}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wcell{border:1px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;border-left-width:4px}
.wcell span{font-family:"IBM Plex Mono",monospace;color:var(--muted)}
.wcell.b-g{border-left-color:var(--recovery)}.wcell.b-y{border-left-color:var(--load)}.wcell.b-r{border-left-color:var(--neg)}
.wcell.cur{outline:2px solid var(--ink);outline-offset:1px}
.note-ta{font-size:15px;line-height:1.45;min-height:64px;width:100%;max-width:100%;box-sizing:border-box}
.npend{font-size:12px;color:var(--accent2);font-weight:600;margin-top:4px}
.zarea>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zarea>summary .zt{flex:1;min-width:110px}
.gttimerbtn{font-weight:700;border-color:var(--recovery);color:var(--recovery)}.gttimerbtn span{font-weight:500;color:var(--muted);margin-left:4px}
.gtt{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--paper);color:var(--ink);text-align:center}
.gtt.work{background:var(--load);color:#fff}.gtt.rest{background:var(--recovery);color:#fff}.gtt.setrest{background:#3D6CB0;color:#fff}
.gtt-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;opacity:.9}
.gtt-x{border:0;background:rgba(0,0,0,.15);color:inherit;width:40px;height:40px;border-radius:20px;font-size:22px;cursor:pointer}
.gtt-label{font-size:24px;font-weight:700}.gtt-time{font-family:"IBM Plex Mono",monospace;font-size:120px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.gtt-pos{font-size:17px;font-weight:600}.gtt-next{font-size:14px;opacity:.85}
.gtt-bar{width:min(320px,80vw);height:8px;border-radius:4px;background:rgba(0,0,0,.18);overflow:hidden}.gtt-bar i{display:block;height:100%;background:currentColor}
.gtt-acts{display:flex;gap:10px;margin-top:12px}.gtt-acts .btn{min-width:120px;background:rgba(255,255,255,.92);color:#191C18;border:0}
.mkt{font-size:11px;font-weight:600;color:var(--muted)}
.zarea>summary .zd{display:flex;align-items:center;gap:5px;font-weight:500}
.zarea>summary .dim{font-size:11px;color:var(--muted);font-weight:600}
.zarea>summary::after{margin-left:6px}

<script>
"use strict";
/* =====================================================================
   Tracking v2 — Erfassung wie im Training Monitor
   (Sessions · Krafttraining · Kraftmessung · Gewicht), gespeichert in tracking.xlsx
   ===================================================================== */
const FILE_TRACKING="tracking.xlsx", FILE_PLAN="signalpult-mappe.xlsx", FILE_MOBILITY="mobility-baseline.xlsx";
const LS_STATE="tracking.state.v2", LS_GOALS="tracking.goals.v1", LS_UI="tracking.ui.v2";

/* ---- aus dem Training Monitor ---- */
const SESS_SPORTS=[["climb","Klettern"],["kick","Kickbox"],["other","Sonstiges"]];
const SESS_INT_LABELS={1:"sehr leicht",2:"leicht",3:"moderat",4:"hart",5:"maximal"};
const SESS_VOL_LABELS={1:"sehr wenig",2:"wenig",3:"mittel",4:"viel",5:"sehr viel"};
const MEAS_PHASES=["vor Training","nach Training","in Training","Ruhetag"];
/* STR_CATS wie im Monitor; „Griffkraft“ ergänzt, weil die Planung einen Bereich Kraft · Griffkraft hat */
const STR_CATS=[["hinge","Hinge"],["squat","Squat"],["push","Oberkörper Push"],["pull","Oberkörper Pull"],["grip","Griffkraft"],["other","Sonstiges"]];
const STR_TYPE_LABEL={weighted:"Gewicht",bodyweight:"Körpergewicht",hold:"Halten"};
const RIR_BANDS=[[1,"0–2"],[3,"2–4"],[5,"4+"]];
const PLAN_AREAS=[["gesamt","Gesamt"],["klettern","Klettern"],["velo","Velo"],["kickbox","Kickbox"],["ausdauer","Ausdauer"],["kraft_hinge","Kraft · Hinge"],["kraft_squat","Kraft · Squat"],["kraft_push","Kraft · Push"],["kraft_pull","Kraft · Pull"],["kraft_grip","Kraft · Griff"]];
const INFO={
  lsi:"LSI (Seitensymmetrie): Verhältnis der schwächeren zur stärkeren Körperseite. 100 % = perfekt symmetrisch, unter 90 % gilt als Defizit.",
  weightAvg:"Ø Gewicht (alle): Mittel aller Wiegungen der letzten 7 Tage, unabhängig von den Bedingungen.",
  weightRef:"Ø Referenzgewicht: Mittel nur der vergleichbaren Wiegungen (nüchtern und ohne Kleidung) der letzten 7 Tage — der aussagekräftigere Wert für den Verlauf."};

/* =====================================================================
   HILFSFUNKTIONEN
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p||"")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function num(v){if(v==null||v==="")return null;if(typeof v==="number")return isFinite(v)?v:null;const s=String(v).trim().replace(",",".");if(/^inf/i.test(s))return null;const n=parseFloat(s);return isNaN(n)?null:n;}
function fmt(v,d){if(v==null||isNaN(v))return "–";const p=d==null?1:d;return (+v).toLocaleString("de-CH",{minimumFractionDigits:0,maximumFractionDigits:p});}
function toISODate(v){
  if(v==null||v==="")return null;
  if(v instanceof Date){if(isNaN(v))return null;return new Date(v.getTime()+12*36e5).toISOString().slice(0,10);}
  if(typeof v==="number"){if(v<20000||v>80000)return null;return new Date(Math.round((v-25569)*864e5)+12*36e5).toISOString().slice(0,10);}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(m)return `${m[3].length===2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m)return `${m[3].length===2?"20"+m[3]:m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`;
  return null;}
function weekKey(iso){const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function isoWeekNo(k){const d=new Date(k+"T00:00:00Z");const th=new Date(d);th.setUTCDate(d.getUTCDate()+3-((d.getUTCDay()+6)%7));const f=new Date(Date.UTC(th.getUTCFullYear(),0,4));return 1+Math.round(((th-f)/864e5-3+((f.getUTCDay()+6)%7))/7);}
function kwLabel(iso){if(!iso)return "";const k=weekKey(iso);return "KW "+isoWeekNo(k)+" · "+new Date(addDays(k,3)+"T00:00:00Z").getUTCFullYear();}
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function fmtRange(k){const a=new Date(k+"T00:00:00Z"),b=new Date(a);b.setUTCDate(a.getUTCDate()+6);return a.getUTCMonth()===b.getUTCMonth()?`${a.getUTCDate()}.–${b.getUTCDate()}. ${MON[b.getUTCMonth()]}`:`${a.getUTCDate()}. ${MON[a.getUTCMonth()]} – ${b.getUTCDate()}. ${MON[b.getUTCMonth()]}`;}
function fmtDate(iso){if(!iso)return "–";const d=new Date(iso+"T00:00:00Z");return `${["So","Mo","Di","Mi","Do","Fr","Sa"][d.getUTCDay()]} ${d.getUTCDate()}. ${MON[d.getUTCMonth()]}`;}
function lsi(a,b){a=num(a);b=num(b);if(!a||!b)return null;return +(Math.min(a,b)/Math.max(a,b)*100).toFixed(1);}
const band=v=>v==null?"":v>=90?"g":v>=80?"y":"r";
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* =====================================================================
   ZUSTAND
   ===================================================================== */
function emptyState(){return {
  sessions:[], str:[], strExercises:[], strMaterials:[], strLocations:[], measures:[], jumps:[], weight:[], weekChecks:[], planNotes:[], gripTrain:[],
  settings:{reflection:{climb:[],kick:[],other:[]},focusTags:{climb:[],kick:[],other:[]},defaultBodyweight:null,weekCats:{},gripPresets:[]},
  meta:{dirty:false,lastSaved:null,fileStamp:null}};}
function normState(x){const e=emptyState();x=Object.assign(e,x||{});x.settings=Object.assign(e.settings,x.settings||{});
  ["reflection","focusTags"].forEach(k=>{x.settings[k]=Object.assign({climb:[],kick:[],other:[]},x.settings[k]||{});});
  x.meta=Object.assign(emptyState().meta,x.meta||{});return x;}
let S=normState(lsGet(LS_STATE));
let GOALS=lsGet(LS_GOALS);
let UI=Object.assign({tab:"woche",sess:"climb",kraft:"str",weekOffset:0,autoSave:false},lsGet(LS_UI)||{});
function saveUI(){lsSet(LS_UI,UI);}
function persist(markDirty){if(markDirty!==false)S.meta.dirty=true;lsSet(LS_STATE,S);updatePill();if(markDirty!==false){scheduleAutoSave();if(typeof LINK!=="undefined")LINK.changed();}}
const sortDesc=arr=>arr.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);

/* =====================================================================
   KRAFT-LOGIK (1:1 aus dem Training Monitor)
   ===================================================================== */
const strCatName_=ck=>{const c=STR_CATS.find(x=>x[0]===ck);return c?c[1]:ck;};
const strExById_=id=>S.strExercises.find(x=>x.id===id);
function strBwCoeffDefault_(name){
  const DEF=[[/klimmzug|pull.?up|chin.?up|muscle.?up/,1.0],[/dip|barren/,1.0],[/liege|push.?up|liegestütz/,0.64],[/pike|handstand/,0.9],
    [/pistol|einbein.*kniebeuge|shrimp/,0.85],[/kniebeuge|squat|ausfall|lunge|step.?up/,0.7],[/ruder|row|inverted|australian/,0.6],
    [/hip.?thrust|glute.?bridge|brücke/,0.55],[/plank|planke|hollow|l.?sit|hang|hängen|wall.?sit|halt/,0.6],[/crunch|sit.?up|leg.?raise|beinheben|bauch/,0.4],[/nordic|beinbeuger.*körper/,0.7]];
  const n=String(name||"").toLowerCase();for(const [re,c] of DEF)if(re.test(n))return c;return 0.65;}
/* Körpergewicht am Datum: letzte Messung davor, sonst nächstgelegene, sonst Standard */
function bwForDate_(dateStr){
  const log=S.weight.filter(w=>w&&w.date&&+w.kg>0);
  if(log.length){let onBefore=null,nearest=null,nd=Infinity;const ref=new Date((dateStr||today())+"T00:00:00");
    log.forEach(w=>{if(w.date<=dateStr){if(!onBefore||w.date>onBefore.date)onBefore=w;}const diff=Math.abs(new Date(w.date+"T00:00:00")-ref);if(diff<nd){nd=diff;nearest=w;}});
    const pick=onBefore||nearest;if(pick)return +pick.kg;}
  const def=+S.settings.defaultBodyweight;return def>0?def:null;}
const strLoadType_=ex=>(ex&&ex.loadType)||"weighted";
function strEffLoad_(ex,st,bw){const lt=strLoadType_(ex);if(lt==="weighted")return (+st.kg||0);const coeff=(ex.bwCoeff!=null?+ex.bwCoeff:0.65);return (bw!=null?bw*coeff:0)+(+st.addedKg||0);}
function strSetKg_(w,ex,st){if(strLoadType_(ex)==="hold")return null;const bw=(w&&w.bw!=null)?+w.bw:bwForDate_(w&&w.date);return strEffLoad_(ex,st,bw);}
const strSetReps_=(ex,st)=>strLoadType_(ex)==="hold"?null:(+st.reps||0);
function e1rm_(kg,reps){kg=+kg;reps=+reps;if(!(kg>0)||!(reps>=1)||reps>5)return null;if(reps===1)return kg;return kg*(1+reps/30);}
function e1rmRir_(kg,reps,rir){kg=+kg;reps=+reps;if(rir==null||rir==="")return null;rir=+rir;if(!(rir>=0))return null;const eff=reps+rir;if(!(kg>0)||!(eff>=1)||eff>5)return null;if(eff===1)return kg;return kg*(1+eff/30);}
const strExKey_=ex=>ex.exerciseId||("name:"+(ex.name||""));
function strEach_(exKey,fn){S.str.forEach(w=>(w.exercises||[]).forEach(ex=>{if(strExKey_(ex)===exKey)fn(w,ex);}));}
function strTested_(exKey,fn){const ce=strExById_(exKey);if(ce&&Array.isArray(ce.tested))ce.tested.forEach(t=>{if(t&&+t.kg>0)fn(+t.kg);});}
function strBestPR_(exKey){let best=null;strEach_(exKey,(w,ex)=>(ex.sets||[]).forEach(st=>{const e=e1rm_(strSetKg_(w,ex,st),strSetReps_(ex,st));if(e!=null&&(best==null||e>best))best=e;}));strTested_(exKey,kg=>{if(best==null||kg>best)best=kg;});return best;}
function strBestPRRir_(exKey){let best=null;strEach_(exKey,(w,ex)=>(ex.sets||[]).forEach(st=>{const e=e1rmRir_(strSetKg_(w,ex,st),strSetReps_(ex,st),st.rir);if(e!=null&&(best==null||e>best))best=e;}));strTested_(exKey,kg=>{if(best==null||kg>best)best=kg;});return best;}
function strBestReps_(exKey,onlyBw){let best=null;strEach_(exKey,(w,ex)=>{if(strLoadType_(ex)==="hold")return;(ex.sets||[]).forEach(st=>{if(onlyBw&&strLoadType_(ex)==="bodyweight"&&(+st.addedKg||0)>0)return;const r=+st.reps||0;if(r>0&&(best==null||r>best))best=r;});});return best;}
function strBestHold_(exKey){let best=null;strEach_(exKey,(w,ex)=>{if(strLoadType_(ex)!=="hold")return;(ex.sets||[]).forEach(st=>{const s=+st.sec||0;if(s>0&&(best==null||s>best))best=s;});});return best;}
/* Tonnage/Ø-Last eines Eintrags (Halten zählt nicht, unilateral ×2) */
function strEntryVol_(w){let vol=0,reps=0;(w.exercises||[]).forEach(ex=>{if(strLoadType_(ex)==="hold")return;const m=ex.unilateral?2:1;(ex.sets||[]).forEach(st=>{const r=+st.reps||0;const kg=strSetKg_(w,ex,st)||0;vol+=r*kg*m;reps+=r;});});
  return {vol:vol||null,inten:reps?+(vol/reps).toFixed(1):null};}
const strMaterials=()=>S.strMaterials;
const strLocations=()=>S.strLocations;
const strLocationById_=id=>S.strLocations.find(l=>l.id===id)||null;
const strExMaterials_=ex=>Array.isArray(ex&&ex.materials)?ex.materials:[];
function strExAvailableAt_(ex,loc){if(!loc)return true;const have=new Set(loc.materials||[]);return strExMaterials_(ex).every(m=>have.has(m));}

/* Sessions */
const sessionsForSport_=sp=>S.sessions.filter(x=>x.sport===sp);
const sessReflectionSet_=sp=>S.settings.reflection[sp]||[];
const sessFocusReg_=sp=>S.settings.focusTags[sp]||[];
function sessAllFocusTags_(sp){const s=new Set(sessFocusReg_(sp));sessionsForSport_(sp).forEach(x=>(x.focusTags||[]).forEach(t=>s.add(t)));return [...s].sort((a,b)=>a.localeCompare(b,"de"));}
const sessTagLabel_=sp=>sp==="other"?"Sportart":"Fokus";
const sportLabel=k=>(SESS_SPORTS.find(x=>x[0]===k)||[0,k])[1];
function sportKeyFromLabel(l){l=String(l||"").toLowerCase();if(/kletter|boulder|climb/.test(l))return "climb";if(/kick|box/.test(l))return "kick";return "other";}

/* Gewicht: Wochenwerte wie im Monitor (letzte 7 Kalendertage) */
function weeklyWeightStats(){const wkAgo=addDays(today(),-7);const inW=S.weight.filter(w=>w.date>=wkAgo);
  const r=a=>a.length?+(avg(a)).toFixed(1):null;return {avgAll:r(inW.map(w=>w.kg)),avgRef:r(inW.filter(w=>w.cond&&w.cond.fasted===true&&w.cond.clothed===false).map(w=>w.kg))};}

/* =====================================================================
   EXCEL — tracking.xlsx (Blattnamen & Spaltentitel = Vertrag mit der Planung)
   ===================================================================== */
const HEAD_ST={font:{bold:true,color:{rgb:"FFFFFF"}},fill:{patternType:"solid",fgColor:{rgb:"2E6F72"}},alignment:{vertical:"center",wrapText:true}};
const HEAD_DER={font:{bold:true,color:{rgb:"FFFFFF"}},fill:{patternType:"solid",fgColor:{rgb:"9A9E94"}},alignment:{vertical:"center",wrapText:true}};
const B=v=>v==null?"":v;
const yn=v=>v===true?"ja":v===false?"nein":"";
function parseYn(v){const s=String(v==null?"":v).trim().toLowerCase();if(/^(ja|j|yes|y|x|1|true)$/.test(s))return true;if(/^(nein|n|no|0|false)$/.test(s))return false;return null;}
const list=v=>String(v==null?"":v).split(/[;]/).map(x=>x.trim()).filter(Boolean);
function makeSheet(headers,rows,widths,derived){
  const ws=XLSX.utils.aoa_to_sheet([headers].concat(rows));
  headers.forEach((h,c)=>{const r=XLSX.utils.encode_cell({r:0,c});if(ws[r])ws[r].s=(derived&&derived.includes(h))?HEAD_DER:HEAD_ST;});
  ws["!cols"]=(widths||headers.map(()=>14)).map(w=>({wch:w}));
  if(rows.length)ws["!autofilter"]={ref:XLSX.utils.encode_range({r:0,c:0},{r:rows.length,c:headers.length-1})};
  return ws;}
const asc=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
const rirTxt=v=>v==null||v===""?"":(RIR_BANDS.find(b=>b[0]===+v)||[0,String(v)])[1];
function rirParse(v){if(v==null||v==="")return null;const s=String(v).trim();if(/^4\+|^5/.test(s))return 5;if(/^2\s*[–-]\s*4|^3/.test(s))return 3;if(/^0\s*[–-]\s*2|^[012]$/.test(s))return 1;if(/^4$/.test(s))return 3;const n=num(s);return n==null?null:(n<=2?1:n<=4?3:5);}

function buildWorkbook(){
  const wb=XLSX.utils.book_new();
  const info=[["Tracking — Excel-Mappe"],[""],
    ["Diese Datei ist die Wahrheit: in Excel/Sheets bearbeiten, danach in der App wieder laden."],
    ["Blaue Spalten = Eingaben. Graue Spalten rechnet die App beim Laden neu (z. B. LSI, Tonnage)."],
    ["Neue Zeilen: ID leer lassen. Datum als 2026-09-24 oder 24.09.2026. Listen mit Semikolon trennen."],
    ["Blattnamen und Spaltentitel nicht umbenennen — die Planung (Signalpult) liest sie."],[""],
    ["Blatt","Inhalt","Skala / Hinweis"],
    ["Sessions","Klettern, Kickbox, Sonstiges","Intensität 1–5 (sehr leicht … maximal) · Volumen 1–5 (sehr wenig … sehr viel) · Sportart bei Sonstiges = Fokus-Tags"],
    ["Technik-Reflexion","Antworten je Session und Frage","Frage als Snapshot — alte Einträge bleiben lesbar, wenn Fragen sich ändern"],
    ["Kraft-Einträge","ein Eintrag = eine Trainingswoche (wie im Training Monitor)","Anzahl Sessions · Trainingsort · Körpergewicht-Snapshot"],
    ["Kraft-Sätze","ein Satz pro Zeile","Gewicht: Wdh × kg · Körpergewicht: Wdh (+ Zusatz-kg, negativ = Assistenz) · Halten: Sek (+ Zusatz-kg) · RIR: 0–2 / 2–4 / 4+"],
    ["Kraft-Katalog","Katalog","Lasttyp Gewicht/Körpergewicht/Halten · KG-Faktor % · unilateral = Tonnage ×2 · Material & getestete 1RM mit Semikolon"],
    ["Trainingsorte","Orte mit vorhandenem Material","filtert die Übungsauswahl"],
    ["Kraftmessung","Griffkraft L/R mit Phase","Phase: vor Training, nach Training, in Training, Ruhetag · LSI = schwächere ÷ stärkere Seite × 100"],
    ["Sprung","Sprungsensor je Session und Bein","cm · RSI · W · ms · mm"],
    ["Gewicht","Körpergewicht","Bedingungen ja/nein bzw. mit/ohne; leer = nicht angegeben · Referenz = nüchtern + ohne Kleidung"],
    ["Tracking-Einstellungen","Reflexionsfragen, Fokus-Tags, Standard-Körpergewicht, Wochenübersicht",""],[""],["Exportiert",new Date().toLocaleString("de-CH")]];
  const wsI=XLSX.utils.aoa_to_sheet(info);wsI["!cols"]=[{wch:18},{wch:48},{wch:90}];if(wsI.A1)wsI.A1.s={font:{bold:true,sz:14}};["A8","B8","C8"].forEach(r=>{if(wsI[r])wsI[r].s=HEAD_ST;});
  XLSX.utils.book_append_sheet(wb,wsI,"Tracking-Info");

  XLSX.utils.book_append_sheet(wb,makeSheet(["Datum","Sportart","Intensität","Volumen","Fokus-Tags","Fokus-Notiz","ID"],
    S.sessions.slice().sort(asc).map(s=>[s.date,sportLabel(s.sport),B(s.intensity),B(s.volume),(s.focusTags||[]).join("; "),s.focusNote||"",s.id]),[12,12,11,10,28,36,16]),"Sessions");
  const tech=[];S.sessions.slice().sort(asc).forEach(s=>(s.technique||[]).forEach(t=>tech.push([s.date,sportLabel(s.sport),t.q||"",t.a||"",t.qid||"",s.id])));
  XLSX.utils.book_append_sheet(wb,makeSheet(["Datum","Sportart","Frage","Antwort","Frage-ID","Session-ID"],tech,[12,12,40,50,14,16]),"Technik-Reflexion");

  XLSX.utils.book_append_sheet(wb,makeSheet(["Eintrag-ID","Datum","Anzahl Sessions","Trainingsort","Körpergewicht (kg)","Notiz","Tonnage (kg)","Ø Last (kg)"],
    S.str.slice().sort(asc).map(w=>{const v=strEntryVol_(w);return [w.id,w.date,B(w.n),w.location||"",B(w.bw),w.note||"",v.vol!=null?Math.round(v.vol):"",B(v.inten)];}),[16,12,14,16,16,30,12,11],["Tonnage (kg)","Ø Last (kg)"]),"Kraft-Einträge");
  const sets=[];S.str.slice().sort(asc).forEach(w=>(w.exercises||[]).forEach(ex=>(ex.sets||[]).forEach((st,i)=>{const lt=strLoadType_(ex);
    sets.push([w.date,w.id,ex.name,strCatName_(ex.category),STR_TYPE_LABEL[lt],ex.unilateral?"ja":"nein",lt==="weighted"?"":Math.round((ex.bwCoeff!=null?ex.bwCoeff:0.65)*100),i+1,
      lt==="hold"?"":B(st.reps),lt==="weighted"?B(st.kg):"",lt==="weighted"?"":B(st.addedKg),lt==="hold"?B(st.sec):"",rirTxt(st.rir),ex.exerciseId||""]);})));
  XLSX.utils.book_append_sheet(wb,makeSheet(["Datum","Eintrag-ID","Übung","Kategorie","Lasttyp","Unilateral","KG-Faktor %","Satz","Wdh","kg","Zusatz-kg","Sek","RIR","Übung-ID"],sets,[12,16,24,16,14,10,11,6,6,8,10,6,7,14]),"Kraft-Sätze");
  XLSX.utils.book_append_sheet(wb,makeSheet(["Übung-ID","Übung","Kategorie","Lasttyp","KG-Faktor %","Unilateral","Material","Getestete 1RM","Fokus"],
    S.strExercises.map(e=>[e.id,e.name,strCatName_(e.category),STR_TYPE_LABEL[strLoadType_(e)],strLoadType_(e)==="weighted"?"":Math.round((e.bwCoeff!=null?e.bwCoeff:0.65)*100),e.unilateral?"ja":"nein",
      strExMaterials_(e).join("; "),(e.tested||[]).map(t=>t.date+": "+t.kg).join("; "),e.focus?"ja":"nein"]),[14,26,16,14,11,10,28,28,8]),"Kraft-Katalog");
  const locRows=S.strLocations.map(l=>[l.name,(l.materials||[]).join("; ")]);
  S.strMaterials.filter(m=>!S.strLocations.some(l=>(l.materials||[]).includes(m))).forEach(m=>locRows.push(["(ohne Ort)",m]));
  XLSX.utils.book_append_sheet(wb,makeSheet(["Trainingsort","Material"],locRows,[20,60]),"Trainingsorte");

function trkSheet(wb,neu,alt,col){if(wb.Sheets[neu])return neu;const ws=wb.Sheets[alt];if(!ws)return neu;const h=(XLSX.utils.sheet_to_json(ws,{header:1,defval:""})[0]||[]).map(x=>String(x).trim());return h.includes(col)?alt:neu;}
const TRACK_SHEETS=["Tracking-Info","Sessions","Technik-Reflexion","Kraft-Einträge","Kraft-Sätze","Kraft-Katalog","Trainingsorte","Kraftmessung","Griff-Training","Griff-Presets","Sprung","Gewicht","Tracking-Einstellungen","Ziele-Notizen","Wochen-Check"];

    if(lt!=="weighted")e.bwCoeff=f>0?f/100:strBwCoeffDefault_(name);N.strExercises.push(e);e.materials.forEach(m=>{if(!N.strMaterials.includes(m))N.strMaterials.push(m);});});
  sheetObjs(wb,"Trainingsorte").forEach(r=>{const n=String(r["Trainingsort"]||"").trim();const mats=list(r["Material"]);mats.forEach(m=>{if(!N.strMaterials.includes(m))N.strMaterials.push(m);});

  sheetObjs(wb,"Kraft-Sätze").forEach((r,i)=>{const d=toISODate(r["Datum"]);const nm=String(r["Übung"]||"").trim();if(!d||!nm){if(nm)issues.push(`Kraft-Sätze Zeile ${i+2}: Datum fehlt`);return;}

    let ex=w.exercises.find(x=>x.exerciseId===cat.id);
    if(!ex){const lt=r["Lasttyp"]?ltKey(r["Lasttyp"]):cat.loadType;const f=num(r["KG-Faktor %"]);ex={exerciseId:cat.id,name:cat.name,category:r["Kategorie"]?catKey(r["Kategorie"]):cat.category,unilateral:r["Unilateral"]!==""?parseYn(r["Unilateral"])===true:!!cat.unilateral,loadType:lt,sets:[]};
      if(lt!=="weighted")ex.bwCoeff=f>0?f/100:(cat.bwCoeff!=null?cat.bwCoeff:0.65);w.exercises.push(ex);}

    const ph=MEAS_PHASES.find(p=>p.toLowerCase()===String(r["Phase"]||"").trim().toLowerCase())||String(r["Phase"]||"").trim();

  sortDesc(N.measures);
  sheetObjs(wb,"Sprung").forEach(r=>{const d=toISODate(r["Datum"]);if(!d)return;const b=String(r["Bein"]||"").toLowerCase();
    N.jumps.push({id:idOr(r["ID"],"j"),date:d,time:String(r["Zeit"]||""),leg:/^l/.test(b)?"left":/^r/.test(b)?"right":"both",drill:String(r["Drill"]||""),weight_kg:num(r["Zusatzlast (kg)"]),reps:num(r["Wdh"]),
      best:num(r["Höhe best (cm)"]),mean:num(r["Höhe Ø (cm)"]),rsi:num(r["RSI best"]),rsi_mean:num(r["RSI Ø"]),mean_power_w:num(r["Ø Leistung (W)"]),peak_power_w:num(r["Peak Power (W)"]),
      ttpv_ms:num(r["TTPV best (ms)"]),ttpv_mean_ms:num(r["TTPV Ø (ms)"]),squat_mm:num(r["Kniebeugentiefe (mm)"]),source:String(r["Quelle"]||"")});});
  sheetObjs(wb,"Gewicht").forEach((r,i)=>{const d=toISODate(r["Datum"]);const kg=num(r["Gewicht (kg)"]);if(!d||kg==null){if(kg!=null)issues.push(`Gewicht Zeile ${i+2}: Datum unlesbar`);return;}
    const k=String(r["Kleidung"]||"").trim().toLowerCase();N.weight.push({id:idOr(r["ID"],"w"),date:d,kg,cond:{fasted:parseYn(r["Nüchtern"]),toilet:parseYn(r["nach WC"]),clothed:k==="mit"?true:k==="ohne"?false:parseYn(k)},note:String(r["Notiz"]||"")});});
  sortDesc(N.weight);
  sheetObjs(wb,trkSheet(wb,"Tracking-Einstellungen","Einstellungen","Typ")).forEach(r=>{if(/wochen/i.test(String(r["Typ"]||""))){const k=String(r["ID"]||"").trim();if(k)N.settings.weekCats[k]=!/aus|nein|off/i.test(String(r["Wert"]||""));}});
  sheetObjs(wb,"Griff-Presets").forEach(r=>{const n=String(r["Preset"]||"").trim();if(!n)return;const h=String(r["Hand"]||"").toLowerCase();
    const hs=String(r["Hand / Ausführung"]||r["Hand"]||"").toLowerCase();const kind=/test/i.test(String(r["Art"]||""))?"test":"train";
    N.settings.gripPresets.push({id:idOr(r["ID"],"gp"),name:n,kind,program:String(r["Programm"]||""),hand:/^l/.test(hs)?"left":/^r/.test(hs)?"right":"both",lat:/^uni/.test(hs)||(kind==="train"&&/^(l|r)/.test(hs))?"uni":"bi",sets:num(r["Sätze"]),reps:num(r["Wdh"]),sec:num(r["Sek/Wdh"]),restRep:num(r["Pause Wdh (s)"]),restSet:num(r["Satzpause (s)"]),load:num(r["Ø Last (kg)"]),note:String(r["Notiz"]||"")});});

    N.gripTrain.push({id:idOr(r["ID"],"gt"),kind,lat:/^uni/.test(h)||(kind==="train"&&/^(l|r)/.test(h))?"uni":"bi",restRep:num(r["Pause Wdh (s)"]),restSet:num(r["Satzpause (s)"]),date:d,time:String(r["Zeit"]||""),source:/sensor/i.test(String(r["Quelle"]||""))?"sensor":"manual",program:String(r["Programm"]||""),hand:/^l/.test(h)?"left":/^r/.test(h)?"right":"both",
      sets:num(r["Sätze"]),reps:num(r["Wdh"]),sec:num(r["Sek/Wdh"]),load:num(r["Ø Last (kg)"]),peak:num(r["Peak (kg)"]),tut:/sensor/i.test(String(r["Quelle"]||""))?num(r["TUT (s)"]):null,vol:/sensor/i.test(String(r["Quelle"]||""))?num(r["Volumen (kg·s)"]):null,mvc:num(r["Intensität (% MVC)"]),band:num(r["Im Zielband (%)"]),note:String(r["Notiz"]||""),sensorId:String(r["Sensor-ID"]||"")});});

/* Plan → Ziele (unverändert aus v1) */
function parsePlanWb(wb,fileName){
  const rows=[],colors={};const aoa=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}):null;
  const findHdr=(A,key)=>{for(let i=0;i<A.length;i++)if(A[i]&&A[i].some(c=>String(c).trim()===key))return i;return -1;};
  const col=(H,n)=>H.map(x=>String(x).trim()).indexOf(n);
  const ph=aoa("Phasen");if(ph){const h=findHdr(ph,"Name");if(h>=0)for(let i=h+1;i<ph.length;i++){const n=String(ph[i][0]||"").trim();let c=String(ph[i][1]||"").trim();if(n&&c){if(c[0]!=="#")c="#"+c;colors[n]=c;}}}
  const push=(wk,area,dim,phase,note)=>{wk=toISODate(wk);if(!wk)return;wk=weekKey(wk);phase=String(phase||"").trim();note=String(note||"").trim();if(phase||note)rows.push({wk,area,dim,phase,note});};
  const Z=aoa("Ziele");
  if(Z){const h=findHdr(Z,"Woche (Montag)");if(h>=0){const H=Z[h],wi=col(H,"Woche (Montag)"),ki=col(H,"Bereich-Key"),bi=col(H,"Bereich"),di=col(H,"Dimension"),pi=col(H,"Plan-Phase"),ni=col(H,"Notiz");
    for(let i=h+1;i<Z.length;i++){const r=Z[i];let key=ki>=0?String(r[ki]).trim():"";if(!key){const lb=String(r[bi]||"").trim();const hit=PLAN_AREAS.find(a=>a[1]===lb);key=hit?hit[0]:lb.toLowerCase();}
      const dl=String(r[di]||"").toLowerCase();push(r[wi],key,dl.startsWith("vol")?"vol":dl.startsWith("int")?"int":dl.startsWith("makro")?"makro":"all",r[pi],ni>=0?r[ni]:"");}}}
  else{
    const G=aoa("Gesamt");if(G){const h=findHdr(G,"Woche (Montag)");if(h>=0){const H=G[h],wi=col(H,"Woche (Montag)"),pi=col(H,"Plan-Phase"),ni=col(H,"Notiz");for(let i=h+1;i<G.length;i++)push(G[i][wi],"gesamt","all",G[i][pi],ni>=0?G[i][ni]:"");}}
    [["Klettern","klettern"],["Velo","velo"],["Kickbox","kickbox"]].forEach(([sn,key])=>{const A=aoa(sn);if(!A)return;const h=findHdr(A,"Woche (Montag)");if(h<0)return;const H=A[h];
      const wi=col(H,"Woche (Montag)"),vp=col(H,"Vol Plan-Phase"),ip=col(H,"Int Plan-Phase"),vn=col(H,"Vol Notiz"),inn=col(H,"Int Notiz");
      for(let i=h+1;i<A.length;i++){push(A[i][wi],key,"vol",A[i][vp],vn>=0?A[i][vn]:"");push(A[i][wi],key,"int",A[i][ip],inn>=0?A[i][inn]:"");}});
    const K=aoa("Kraft");if(K){const h=findHdr(K,"Woche (Montag)");if(h>=0){const H=K[h],ci=col(H,"Kategorie"),wi=col(H,"Woche (Montag)"),vp=col(H,"Vol Plan-Phase"),ip=col(H,"Int Plan-Phase"),vn=col(H,"Vol Notiz"),inn=col(H,"Int Notiz");
      for(let i=h+1;i<K.length;i++){const c=catKey(K[i][ci]);if(c==="other")continue;push(K[i][wi],"kraft_"+c,"vol",K[i][vp],vn>=0?K[i][vn]:"");push(K[i][wi],"kraft_"+c,"int",K[i][ip],inn>=0?K[i][inn]:"");}}}}
  const balScale=[];const sk=aoa("Skala");if(sk){const h=findHdr(sk,"Bezeichnung");if(h>=0){const bi=col(sk[h],"Bezeichnung");for(let i=h+1;i<sk.length;i++){const l=String(sk[i][bi]||"").trim();if(l)balScale.push(l);}}}
  if(!rows.length&&!Object.keys(colors).length)throw new Error("Keine Plan-Daten gefunden. Erwartet wird die Mappe der Planungs-App (signalpult-mappe.xlsx).");
  return {rows,colors,balScale,file:fileName,loadedAt:Date.now()};}

/* Sprungsensor (Blatt „All“) — Aggregation wie im Training Monitor */
function parseJumpWb(wb,fn){
  const name=wb.Sheets["All"]?"All":wb.SheetNames[0];const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""});
  if(!rows||rows.length<2)throw new Error("Keine Datenzeilen in "+fn);
  const H=rows[0].map(c=>String(c).trim().toLowerCase());const idx=ps=>{for(let i=0;i<H.length;i++)for(const p of ps)if(H[i].includes(p))return i;return -1;};
  const iName=idx(["name"]),iDrill=idx(["drill"]),iWt=idx(["weight"]),iH=idx(["jump height","sprunghöhe"]),iMean=idx(["mean power"]),iPeak=idx(["peak power"]),iSquat=idx(["squat"]),iTTPV=idx(["time to peak","ttpv"]),iRSI=idx(["rsi"]);
  if(iH<0&&iRSI<0)throw new Error(fn+": weder Sprunghöhe noch RSI erkannt.");
  const isMM=iH>=0&&/mm/.test(H[iH]);const sessions=[];let cur=null;
  for(let r=1;r<rows.length;r++){const row=rows[r];const ts=row[0];
    if(ts!==""&&ts!=null){if(cur)sessions.push(cur);const nm=iName>=0?String(row[iName]||"").toLowerCase():"";const wr=iWt>=0?String(row[iWt]||"").trim():"";
      cur={ts,leg:/left|links/.test(nm)?"left":/right|rechts/.test(nm)?"right":"both",drill:iDrill>=0?String(row[iDrill]||"").trim():"",weight_kg:wr?(num(wr.replace(/[^\d.,-]/g,""))):null,reps:[]};}
    if(!cur)continue;const g=i=>{if(i<0)return null;const v=num(row[i]);return v!=null&&v>0?v:null;};const rep={h:g(iH),mean:g(iMean),peak:g(iPeak),squat:g(iSquat),ttpv:g(iTTPV),rsi:g(iRSI)};
    if(rep.h!=null||rep.rsi!=null)cur.reps.push(rep);}
  if(cur)sessions.push(cur);
  const out=[];sessions.forEach(s=>{if(!s.reps.length)return;const {date,time}=splitTs(s.ts);if(!date)return;
    const arr=k=>s.reps.map(r=>r[k]).filter(v=>v!=null),mx=a=>a.length?Math.max(...a):null,mn=a=>a.length?Math.min(...a):null;const cm=v=>v==null?null:+((isMM?v/10:v)).toFixed(1);
    const h=arr("h"),rs=arr("rsi");
    out.push({id:uid("j"),date,time,leg:s.leg,drill:s.drill,weight_kg:s.weight_kg,reps:s.reps.length,best:cm(mx(h)),mean:cm(avg(h)),
      rsi:mx(rs)!=null?+mx(rs).toFixed(2):null,rsi_mean:avg(rs)!=null?+avg(rs).toFixed(2):null,mean_power_w:avg(arr("mean"))!=null?Math.round(avg(arr("mean"))):null,
      peak_power_w:mx(arr("peak"))!=null?Math.round(mx(arr("peak"))):null,ttpv_ms:mn(arr("ttpv")),ttpv_mean_ms:avg(arr("ttpv"))!=null?Math.round(avg(arr("ttpv"))):null,
      squat_mm:avg(arr("squat"))!=null?Math.round(avg(arr("squat"))):null,source:fn});});
  return out;}
function splitTs(v){if(v instanceof Date){const d=new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString();return {date:d.slice(0,10),time:d.slice(11,16)};}
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5)).toISOString();return {date:d.slice(0,10),time:d.slice(11,16)};}
  const s=String(v).trim();const t=s.match(/(\d{1,2}):(\d{2})/);return {date:toISODate(s),time:t?t[1].padStart(2,"0")+":"+t[2]:""};}
function mergeJump(recs){let added=0,dup=0;recs.forEach(r=>{const k=r.date+"|"+r.time+"|"+r.leg;const i=S.jumps.findIndex(j=>j.date+"|"+j.time+"|"+j.leg===k);if(i>=0){r.id=S.jumps[i].id;S.jumps[i]=r;dup++;}else{S.jumps.push(r);added++;}});return {added,dup};}

const JUMP_HEADER=["Timestamp","Name","Time","Drill","weight","Set","Reps","Jump Height(mm)","Mean power(W)","Peak power(W)","Squat distance(mm)","Time to peak velocity(ms)","RSI"];
function jumpTableIn(j){let best=null;
  if(j&&j.sprung&&Array.isArray(j.sprung.rows)&&j.sprung.rows.length){const r=j.sprung.rows;return {rows:r,hasHdr:!!(r[0]&&r[0].some(c=>/jump height|timestamp/i.test(String(c))))};} // Trainingsdatei (Apps Script)
  (function walk(x,d){if(d>6||x==null||best)return;
    if(Array.isArray(x)&&x.length&&x.every(r=>Array.isArray(r))){const hasHdr=x[0].some(c=>/jump height|timestamp/i.test(String(c)));const wide=x.filter(r=>r.length>=8).length;
      if(hasHdr||wide>=Math.max(1,x.length*0.6)){best={rows:x,hasHdr};return;}}
    if(Array.isArray(x)){x.forEach(v=>walk(v,d+1));return;}
    if(typeof x==="object"){const ks=Object.keys(x);const pri=ks.filter(k=>/^all$|values|rows|data/i.test(k));pri.concat(ks.filter(k=>!pri.includes(k))).forEach(k=>walk(x[k],d+1));}})(j,0);
  return best;}

  const rows=t.hasHdr?t.rows:[JUMP_HEADER].concat(t.rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"All");return wb;}

function phoneB64(content){ const a = typeof content==="string" ? new TextEncoder().encode(content) : new Uint8Array(content.buffer?content.buffer:content); let s=""; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s); }

function addStrength(){
  const date=getDate("f_date");const bw=bwForDate_(date);const exercises=[];let missing=false;
  const rir=st=>(st.rir==null||st.rir==="")?null:+st.rir;const addK=st=>(st.addedKg===""||st.addedKg==null)?0:+st.addedKg;
  draftStr.forEach(ex=>{const lt=ex.loadType||"weighted";let sets;
    if(lt==="hold")sets=ex.sets.filter(st=>(+st.sec)>0).map(st=>({sec:+st.sec,addedKg:addK(st),rir:rir(st)}));
    else if(lt==="bodyweight")sets=ex.sets.filter(st=>(+st.reps)>0).map(st=>({reps:+st.reps,addedKg:addK(st),rir:rir(st)}));
    else sets=ex.sets.filter(st=>(+st.reps)>0&&(+st.kg)>=0).map(st=>({reps:+st.reps,kg:+st.kg,rir:rir(st)}));
    if(!sets.length)return;if(!ex.exerciseId){missing=true;return;}
    const saved={exerciseId:ex.exerciseId,name:ex.name||"Übung",category:ex.category||"other",unilateral:!!ex.unilateral,loadType:lt,sets};if(lt!=="weighted")saved.bwCoeff=ex.bwCoeff!=null?+ex.bwCoeff:0.65;exercises.push(saved);});
  if(missing){toast("Für jede Übung mit Sätzen eine Katalog-Übung wählen");return;}
  if(!exercises.length){toast("Mindestens einen Satz eingeben");return;}
  // PR-Erkennung vor dem Einfügen (wie Monitor): 1RM ≤5 Reps, sonst Reps-PR (Körpergewicht), Halten = längster Halt
  const editing=strEditId?S.str.find(w=>w.id===strEditId):null;const bak=editing?S.str.splice(S.str.indexOf(editing),1)[0]:null;const prMsgs=[];
  exercises.forEach(ex=>{const key=ex.exerciseId;
    if(ex.loadType==="hold"){const prev=strBestHold_(key);let ns=0;ex.sets.forEach(st=>{if(+st.sec>ns)ns=+st.sec;});if(ns>0&&(prev==null||ns>prev))prMsgs.push(ex.name+" "+ns+" s");return;}
    const prev=strBestPR_(key);let ne=null;ex.sets.forEach(st=>{const e=e1rm_(strEffLoad_(ex,st,bw),st.reps);if(e!=null&&(ne==null||e>ne))ne=e;});
    if(ne!=null&&(prev==null||ne>prev+0.001)){prMsgs.push(ex.name+" ≈ "+Math.round(ne)+" kg");return;}
    if(ex.loadType==="bodyweight"){const pr=strBestReps_(key,true);let nr=0,bo=false;ex.sets.forEach(st=>{if((+st.addedKg||0)<=0){bo=true;if(+st.reps>nr)nr=+st.reps;}});if(bo&&nr>0&&(pr==null||nr>pr))prMsgs.push(ex.name+" "+nr+" Reps");}});
  if(bak)S.str.push(bak);
  const loc=draftStrLocation?strLocationById_(draftStrLocation):null;
  const rec={id:editing?editing.id:uid("sw"),date,bw,exercises,locationId:loc?loc.id:null,location:loc?loc.name:null,n:+$("#f_n").value||0,note:$("#f_note").value};
  if(editing){const i=S.str.findIndex(w=>w.id===editing.id);S.str[i]=rec;}else S.str.unshift(rec);sortDesc(S.str);
  strEditId=null;draftStr=[blankEx()];draftStrLocation=null;persist();render();
  toast(prMsgs.length?"Neuer PR: "+prMsgs.join(" · "):(editing?"Woche aktualisiert":"Gespeichert"));}
function strEditWeek(id){const w=S.str.find(x=>x.id===id);if(!w)return;strEditId=id;draftStrLocation=w.locationId||null;
  draftStr=(w.exercises||[]).map(ex=>({exerciseId:ex.exerciseId,name:ex.name,category:ex.category||"other",unilateral:!!ex.unilateral,loadType:ex.loadType||"weighted",bwCoeff:ex.bwCoeff!=null?ex.bwCoeff:null,sets:(ex.sets||[]).map(st=>Object.assign({},st))}));

function measPhaseBtns_(){return MEAS_PHASES.map(p=>`<button type="button" class="chip" aria-pressed="${measPhase===p}" data-act="measPhase" data-v="${p}">${p}</button>`).join("");}
const JUMP_METRICS=[
  {key:"jump",label:"Sprunghöhe",get:j=>j.best,unit:"cm",bigger:"better",fix:1},{key:"rsi",label:"Reaktivkraft-Index",get:j=>j.rsi,unit:"",bigger:"better",fix:2},
  {key:"mean_power",label:"Ø Leistung",get:j=>j.mean_power_w,unit:"W",bigger:"better",fix:0},{key:"peak_power",label:"Max. Leistung",get:j=>j.peak_power_w,unit:"W",bigger:"better",fix:0},
  {key:"squat",label:"Kniebeugentiefe",get:j=>j.squat_mm,unit:"mm",bigger:"symmetric",fix:0},{key:"ttpv",label:"Zeit bis Spitzengeschw.",get:j=>j.ttpv_ms,unit:"ms",bigger:"smaller",fix:0}];
function jumpBalanceDays_(){const by={};S.jumps.forEach(j=>{if(j.leg==="both")return;const d=by[j.date]||(by[j.date]={L:[],R:[]});(j.leg==="left"?d.L:d.R).push(j);});
  const out=[];Object.keys(by).sort().reverse().forEach(date=>{const {L,R}=by[date];if(!L.length||!R.length)return;const metrics=[];
    JUMP_METRICS.forEach(M=>{const l=L.map(M.get).filter(v=>v!=null),r=R.map(M.get).filter(v=>v!=null);if(!l.length||!r.length)return;
      const bestL=M.bigger==="smaller"?Math.min(...l):Math.max(...l),bestR=M.bigger==="smaller"?Math.min(...r):Math.max(...r);const lo=Math.min(bestL,bestR),hi=Math.max(bestL,bestR);
      const dominant=bestL===bestR?"=":M.bigger==="smaller"?(bestL<bestR?"L":"R")+" schneller":(bestL>bestR?"L":"R")+" stärker";
      metrics.push({M,bestL,bestR,lsi:hi>0?+(lo/hi*100).toFixed(1):null,asym:+Math.abs(bestL-bestR).toFixed(M.fix),dominant});});
    if(metrics.length)out.push({date,metrics});});return out;}

  if(!S.weight.length)return h+`<div class="list"><div class="empty">Noch keine Messungen.</div></div>`;

    <div class="kpi"><div class="k">Ø Referenz (nüchtern, ohne) ${info("weightRef")}</div><div class="v" style="color:var(--recovery)">${wk.avgRef??"–"}<small> kg</small></div></div></div>`;

    return `<tr><td class="v">${w.date}</td><td class="v">${fmt(w.kg,1)}</td><td class="meta">${esc(cond||"–")}${w.note?"<br>"+esc(w.note):""}</td><td><button class="x" data-act="weightDel" data-id="${w.id}" aria-label="Löschen">×</button></td></tr>`;}).join("")}</table></div>`;

function weightCondHtml_(){return [["fasted","Nüchtern?","nüchtern","nicht nüchtern"],["toilet","Toilette?","nach WC","nicht"],["clothed","Kleidung?","mit Kleidung","ohne Kleidung"]].map(([k,lab,a,b])=>
  `<div><span class="fldlab">${lab}</span><div class="opts"><button type="button" class="opt ${weightCond[k]===true?"g":""}" data-act="wCond" data-k="${k}" data-v="1">${a}</button><button type="button" class="opt ${weightCond[k]===false?"y":""}" data-act="wCond" data-k="${k}" data-v="0">${b}</button></div></div>`).join("");}
function addWeight(){const kg=+$("#wt_kg").value||0;if(!kg){toast("Gewicht eingeben");return;}
  S.weight.unshift({id:uid("w"),date:getDate("wt_date"),kg,cond:Object.assign({},weightCond),note:$("#wt_note").value});sortDesc(S.weight);
  weightCond={fasted:null,toilet:null,clothed:null};persist();render();toast("Gewicht gespeichert");}

    <button class="btn small ghost" style="margin:6px 0 14px" data-act="matAdd">+ Material</button><div class="meta" style="margin-bottom:6px">Trainingsorte</div>

      <div class="chips" style="margin-top:6px">${strMaterials().length?strMaterials().map(m=>`<button class="ftag ${(l.materials||[]).includes(m)?"on":""}" data-act="locMat" data-id="${l.id}" data-m="${esc(m)}">${(l.materials||[]).includes(m)?"✓ ":""}${esc(m)}</button>`).join(""):'<span class="meta">Erst Material anlegen.</span>'}</div></div>`).join(""):'<div class="list"><div class="empty" style="padding:10px">Noch keine Trainingsorte angelegt.</div></div>'}

  h+=`<details class="fold"><summary>Prototyp</summary><div class="body stack"><button class="btn block" data-act="demo">Beispieldaten laden</button><button class="btn danger block" data-act="reset">Alle App-Daten löschen</button><p class="hint" style="margin:0">Löscht nur den Speicher in diesem Browser, nicht die Excel im Ordner.</p></div></details>`;
  return h;}

const findDel=(arr,id)=>{const i=arr.findIndex(x=>x.id===id);return i<0?null:{i,item:arr.splice(i,1)[0]};};
function delWithUndo(arr,id,label,after){const r=findDel(arr,id);if(!r)return;persist();render();if(after)after();undoToast(label,()=>{arr.splice(Math.min(r.i,arr.length),0,r.item);persist();render();});}
function catById(id){return strExById_(id);}
const ACT={
  tab:a=>{entryDateDefault=null;UI.tab=a.dataset.v;saveUI();render();window.scrollTo(0,0);},
  wkCheck:a=>{const wk=addDays(weekKey(today()),7*UI.weekOffset);const k=a.dataset.k;const c=WEEK_CATS.find(x=>x.key===k);const ex=weekCheckOf(wk,k);
    if(ex)S.weekChecks=S.weekChecks.filter(x=>x!==ex);else S.weekChecks.push({wk,cat:k,note:""});persist();render();

  wkGo:a=>{const c=WEEK_CATS.find(x=>x.key===a.dataset.k);const cur=weekKey(today());const wk=addDays(cur,7*UI.weekOffset);

  quickSave:async()=>{if(LINK.linked()){if(await LINK.saveNow())toast("In die Planungsmappe gespeichert");}else if(dirHandle)await fsSave(false);else exportFile();},

  // Sessions
  sessTab:a=>{UI.sess=a.dataset.v;sessFilterTag=null;saveUI();render();},

  sessClose:()=>{sessShowNew=false;sessResetForm_();render();},

  sessScale:a=>{const k=a.dataset.k,v=+a.dataset.v;if(k==="int")sessEdInt=sessEdInt===v?null:v;else sessEdVol=sessEdVol===v?null:v;$(k==="int"?"#sessIntRow":"#sessVolRow").innerHTML=sessScaleRow_(k);},
  sessFocus:a=>{const t=a.dataset.t;const i=sessEdFocus.indexOf(t);if(i>=0)sessEdFocus.splice(i,1);else sessEdFocus.push(t);$("#sessFocusChips").innerHTML=sessFocusChips_(UI.sess);},
  sessFocusNew:a=>{const sp=a.dataset.sp;const keep={note:$("#sessFocusNote").value,tech:{}};document.querySelectorAll("[id^=sessTech_]").forEach(t=>keep.tech[t.id]=t.value);const d=getDate("f_sdate");
    inputModal({title:sp==="other"?"Neue Sportart":"Neuer Fokus-Tag",saveLabel:"Anlegen",fields:[{key:"t",label:sp==="other"?"Sportart":"Fokus-Tag",required:true}],onSave:v=>{const t=v.t.trim();if(!t)return;

      $("#sessFocusChips").innerHTML=sessFocusChips_(sp);$("#sessFocusNote").value=keep.note;Object.keys(keep.tech).forEach(id=>{const el=document.getElementById(id);if(el)el.value=keep.tech[id];});$("#f_sdate").value=d;}});},

  catTest:a=>{const e=catById(a.dataset.id);inputModal({title:"Getestetes 1RM",fields:[{key:"kg",label:"1RM in kg",type:"number",required:true},{key:"date",label:"Datum",type:"date",value:today(),required:true}],

  catCat:a=>{const e=catById(a.dataset.id);const o=STR_CATS.map(c=>c[0]);e.category=o[(o.indexOf(e.category||"other")+1)%o.length];persist();strRenderCatalogList_();},
  catRename:a=>{const e=catById(a.dataset.id);inputModal({title:"Übung umbenennen",fields:[{key:"n",label:"Name",value:e.name,required:true}],onSave:v=>{e.name=v.n.trim();persist();strOpenCatalog();}});},
  catDel:a=>{const arr=S.strExercises;const i=arr.findIndex(x=>x.id===a.dataset.id);if(i<0)return;const it=arr.splice(i,1)[0];persist();strRenderCatalogList_();undoToast("Übung gelöscht",()=>{arr.splice(Math.min(i,arr.length),0,it);persist();strRenderCatalogList_();});},
  // Kraftmessung
  gtPresetUse:a=>{const p=gtPresets().find(x=>x.id===a.dataset.id);if(!p)return;const date=gtDraft?getDate("gt_date"):today();
    gtDraft={kind:p.kind==="test"?"test":"train",date,program:p.program||"",hand:p.hand||"both",lat:p.lat||"bi",sets:p.sets,reps:p.reps,sec:p.sec,restRep:p.restRep,restSet:p.restSet,load:p.load,peak:null,note:p.note||"",_preset:p.id};UI.gtKind=gtDraft.kind;saveUI();render();toast("Preset „"+p.name+"“ geladen");},
  gtPresetNew:()=>{gtReadForm();const d=gtDraft;inputModal({title:"Als Preset speichern",saveLabel:"Speichern",fields:[{key:"n",label:"Name",value:[d.program,d.sets&&d.reps&&d.sec?`${d.sets}×${d.reps}×${d.sec}s`:""].filter(Boolean).join(" "),required:true}],

      if(ex){if(!confirm(`Preset „${ex.name}“ gibt es schon. Überschreiben?`))return;Object.assign(ex,rec);}else P.push(Object.assign({id:uid("gp")},rec));
