/* =====================================================================
   VERBUNDENE DATEIEN — gemeinsame Planungsmappe + Eingangsdateien
   ---------------------------------------------------------------------
   • Android-APK: native Erweiterung „LinkedFile“ (dauerhafte Datei-Erlaubnis,
     auch für Dateien in Google Drive) — wird von setup_apps.py eingebaut.
   • Computer (Chrome/Edge): Datei-Handles der File System Access API.
   Jede App schreibt nur IHRE Blätter in die Mappe und lässt die anderen stehen.
   Änderungen in Excel werden über einen Fingerabdruck der eigenen Blätter erkannt.
   ===================================================================== */
var LINK = (function(){
  let APP = null, links = {}, H = {}, busy = false, ready = false, saveTimer = null, pending = false;
  const XTYPE = { description:"Excel", accept:{ "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"] } };
  const LS = () => "linkedfiles." + APP.key;
  const capNative = () => { const C = window.Capacitor; return !!(C && C.isNativePlatform && C.isNativePlatform()); };
  const isNative = () => capNative() && !!(window.Capacitor.Plugins && window.Capacitor.Plugins.LinkedFile);
  const isFSA = () => !capNative() && ("showOpenFilePicker" in window) && !/Android|iPhone|iPad/i.test(navigator.userAgent);
  const available = () => isNative() || isFSA();
  const P = () => window.Capacitor.Plugins.LinkedFile;
  const clean = l => { const o = {}; Object.keys(l).forEach(k => { if(k[0] !== "_") o[k] = l[k]; }); return o; };
  function load(){ try{ links = JSON.parse(localStorage.getItem(LS())) || {}; }catch(e){ links = {}; } }
  function store(){ try{ const o = {}; Object.keys(links).forEach(k => o[k] = clean(links[k])); localStorage.setItem(LS(), JSON.stringify(o)); }catch(e){} }
  function idb(mode, fn){ return new Promise((res, rej) => { const o = indexedDB.open("linked-files", 1);
    o.onupgradeneeded = () => o.result.createObjectStore("h");
    o.onsuccess = () => { const db = o.result, tx = db.transaction("h", mode), r = fn(tx.objectStore("h")); tx.oncomplete = () => { db.close(); res(r && r.result); }; tx.onerror = () => { db.close(); rej(tx.error); }; };
    o.onerror = () => rej(o.error); }); }
  function b64ToBytes(b){ const s = atob(b || ""); const a = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function bytesToB64(bytes){ const a = new Uint8Array(bytes); let s = ""; for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
  async function handle(l){ if(!H[l.handleKey]) H[l.handleKey] = await idb("readonly", st => st.get(l.handleKey)); return H[l.handleKey]; }

  /* ---- Datei auswählen / anlegen ---- */
  async function pick(slot, create){
    const cfg = APP.slots.find(s => s.id === slot);
    if(isNative()){
      const r = create ? await P().create({ name: cfg.suggest || "planungsmappe.xlsx", write: true }) : await P().pick({ write: !!cfg.write });
      if(cfg.write && r.writable === false) throw new Error("Diese Datei erlaubt der App kein Schreiben. Wähle eine andere Datei oder lege eine neue an.");
      links[slot] = { backend:"native", uri:r.uri, name:r.name || "Datei" };
    } else {
      let h;
      if(create) h = await window.showSaveFilePicker({ suggestedName: cfg.suggest || "planungsmappe.xlsx", types:[XTYPE] });
      else [h] = await window.showOpenFilePicker({ multiple:false, types: cfg.write ? [XTYPE] : undefined });
      const key = APP.key + ":" + slot; await idb("readwrite", st => st.put(h, key)); H[key] = h;
      links[slot] = { backend:"fsa", handleKey:key, name:h.name };
      if(!(await perm(links[slot], !!cfg.write, true))) throw new Error("Zugriff nicht erlaubt");
    }
    store();
  }
  async function perm(l, write, interactive){
    if(l.backend === "native") return isNative();
    const h = await handle(l); if(!h) return false; const o = { mode: write ? "readwrite" : "read" };
    if((await h.queryPermission(o)) === "granted") return true;
    if(!interactive) return false;
    return (await h.requestPermission(o)) === "granted";
  }
  async function read(l){
    if(l.backend === "native"){ const r = await P().read({ uri:l.uri }); if(r.name) l.name = r.name; return { bytes:b64ToBytes(r.data), name:r.name || l.name, lastModified:r.lastModified || 0 }; }
    const f = await (await handle(l)).getFile(); return { bytes:new Uint8Array(await f.arrayBuffer()), name:f.name, lastModified:f.lastModified };
  }
  async function write(l, bytes){
    if(l.backend === "native"){ await P().write({ uri:l.uri, data:bytesToB64(bytes) }); return; }
    const w = await (await handle(l)).createWritable(); await w.write(new Blob([bytes])); await w.close();
  }
  function toWb(bytes, name){
    if(!bytes || !bytes.length) return null;
    if(/\.json$/i.test(name || "")){ const t = new TextDecoder().decode(bytes); return { SheetNames:[], Sheets:{}, __json: JSON.parse(t) }; }
    if(/\.(csv|txt)$/i.test(name || "")) return XLSX.read(new TextDecoder().decode(bytes), { type:"string", cellDates:true });
    return XLSX.read(bytes, { type:"array", cellDates:true, cellStyles:true });
  }
  /* Fingerabdruck von Blättern: nur Werte (keine Formate, keine Formeln) */
  function hash(wb, names){
    let h = 2166136261 >>> 0; const add = s => { for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } };
    names.filter(n => wb.Sheets[n]).sort().forEach(n => { add("§" + n); const ws = wb.Sheets[n];
      Object.keys(ws).filter(k => k[0] !== "!").sort().forEach(k => { const c = ws[k]; if(!c || c.f) return; let v = c.v; if(v == null || v === "") return;
        if(v instanceof Date) v = v.toISOString().slice(0, 10); else if(typeof v === "number") v = +v.toPrecision(12); add(k + "=" + String(v) + ";"); }); });
    return h.toString(36);
  }
  /* Welche Apps haben schon in diese Mappe geschrieben? (Erkennung an typischen Blättern) */
  function appsIn(wb){ const s = wb ? wb.SheetNames : []; const a = [];
    if(s.includes("Ziele") || s.includes("Gesamt")) a.push("planung");
    if(s.includes("Tracking-Info") || s.includes("Kraft-Einträge")) a.push("tracking");
    if(s.includes("Mobility-Übungen")) a.push("mobility");
    return a; }
  const ownIn = wb => APP.ownSheets().filter(n => wb.Sheets[n]);
  const othersIn = wb => wb.SheetNames.filter(n => !APP.ownSheets().includes(n));
  function merge(existing, own){
    const out = XLSX.utils.book_new(); const drop = new Set(APP.ownSheets().concat(own.SheetNames));
    const others = existing ? existing.SheetNames.filter(n => !drop.has(n)) : [];
    const addOwn = () => own.SheetNames.forEach(n => XLSX.utils.book_append_sheet(out, own.Sheets[n], n));
    const addOthers = () => others.forEach(n => XLSX.utils.book_append_sheet(out, existing.Sheets[n], n));
    if(APP.ownFirst){ addOwn(); addOthers(); } else { addOthers(); addOwn(); }
    return out;
  }

  /* ---- In die Mappe schreiben (eigene Blätter ersetzen, fremde behalten) ---- */
  async function doSave(force){
    const m = links.mappe; if(!m) return false;
    if(!(await perm(m, true, false))){ m.needPerm = true; store(); refresh(); return false; }
    let f; try{ f = await read(m); }catch(e){ f = { bytes:new Uint8Array(0), name:m.name }; }
    const wb = toWb(f.bytes, f.name);
    if(wb && !force && m.lastHash){
      const own = ownIn(wb);
      if(own.length){ const h = hash(wb, own);
        if(h !== m.lastHash){
          if(confirm(`Die Daten dieser App wurden in „${m.name}“ inzwischen geändert (z. B. in Excel).\n\nOK = Excel-Stand in die App laden (deine letzten App-Änderungen gehen verloren)\nAbbrechen = App-Stand schreiben (überschreibt die Excel-Änderungen)`)){
            APP.importOwn(wb); m.lastHash = h; store(); if(APP.afterChange) APP.afterChange(); toast("Excel-Stand geladen"); return false;
          }
        }
      }
    }
    const ownWb = APP.buildOwn(); const merged = merge(wb, ownWb);
    await write(m, new Uint8Array(XLSX.write(merged, { bookType:"xlsx", type:"array" })));
    m.lastHash = hash(merged, ownWb.SheetNames); m.apps = appsIn(merged); m.lastSave = Date.now(); m.error = null; m.needPerm = false; store();
    if(APP.markClean) APP.markClean(); refresh(); return true;
  }
  function changed(){ pending = true; if(!links.mappe) return; schedule(); }
  function schedule(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      if(!ready || busy){ schedule(); return; }
      pending = false; busy = true;
      try{ await doSave(false); }
      catch(e){ if(links.mappe){ links.mappe.error = e.message || String(e); store(); } toast("Speichern in die Mappe fehlgeschlagen: " + (e.message || e)); }
      finally{ busy = false; refresh(); }
    }, APP.saveDelay || 2000);
  }

  /* ---- Abgleich: Mappe lesen (fremde Daten übernehmen, eigene Excel-Änderungen erkennen), Eingänge lesen ---- */
  async function sync(interactive){
    if(busy) return; busy = true; const msgs = []; let touched = false;
    try{
      const m = links.mappe;
      if(m){
        if(!(await perm(m, false, interactive))) m.needPerm = true;
        else {
          m.needPerm = false;
          const f = await read(m); const wb = toWb(f.bytes, f.name); m.apps = appsIn(wb);
          if(!wb){ busy = false; await doSave(true); busy = true; msgs.push("Mappe angelegt"); }
          else {
            const oh = hash(wb, APP.readsSheets ? APP.readsSheets().filter(n => wb.Sheets[n]) : othersIn(wb));
            if(oh !== m.othersHash){ try{ const r = APP.consume(wb); if(r){ msgs.push(r); } touched = true; }catch(e){ console.warn(e); } m.othersHash = oh; }
            const own = ownIn(wb);
            if(!own.length){ busy = false; await doSave(true); busy = true; msgs.push("App-Daten in die Mappe geschrieben"); }
            else {
              const h = hash(wb, own);
              if(h !== m.lastHash){
                const first = !m.lastHash;
                if(!first && !APP.isDirty()){ APP.importOwn(wb); m.lastHash = h; touched = true; msgs.push("Excel-Änderungen übernommen"); }
                else {
                  const q = first
                    ? `„${m.name}“ enthält schon Daten dieser App.\n\nOK = diese Daten in die App laden\nAbbrechen = den App-Stand in die Datei schreiben`
                    : `Die Daten dieser App wurden in „${m.name}“ geändert (z. B. in Excel), und in der App gibt es ungespeicherte Änderungen.\n\nOK = Excel-Stand laden (App-Änderungen verwerfen)\nAbbrechen = App-Stand in die Datei schreiben`;
                  if(confirm(q)){ APP.importOwn(wb); m.lastHash = h; touched = true; msgs.push("Daten aus der Mappe geladen"); }
                  else { busy = false; await doSave(true); busy = true; msgs.push("App-Stand in die Mappe geschrieben"); }
                }
              }
            }
          }
          m.lastSync = Date.now(); m.error = null;
        }
      }
      for(const s of APP.slots.filter(s => !s.write)){
        const l = links[s.id]; if(!l) continue;
        if(!(await perm(l, false, interactive))){ l.needPerm = true; continue; }
        l.needPerm = false;
        try{
          const f = await read(l); const key = (f.lastModified || 0) + ":" + f.bytes.length;
          if(key !== l.stamp){ const wb = toWb(f.bytes, f.name); if(wb){ const r = APP.consumeInput(s.id, wb, f.name); if(r) msgs.push(r); touched = true; } l.stamp = key; }
          l.lastSync = Date.now(); l.error = null;
        }catch(e){ l.error = e.message || String(e); }
      }
    }catch(e){ if(links.mappe) links.mappe.error = e.message || String(e); msgs.push("Abgleich fehlgeschlagen: " + (e.message || e)); }
    finally{
      busy = false; ready = true; store();
      if(touched && APP.afterChange) APP.afterChange();
      refresh(); if(msgs.length) toast(msgs.join(" · "));
      if(pending && links.mappe) schedule();
    }
  }

  /* ---- Oberfläche ---- */
  function fmtTime(t){ if(!t) return ""; const d = new Date(t); const same = d.toDateString() === new Date().toDateString(); return (same ? "" : d.toLocaleDateString("de-CH") + " ") + d.toLocaleTimeString("de-CH", { hour:"2-digit", minute:"2-digit" }); }
  function statusOf(l){
    if(!l) return "nicht verbunden";
    if(l.needPerm) return "Zugriff muss erneuert werden";
    if(l.error) return "Fehler: " + l.error;
    return l.lastSave && (!l.lastSync || l.lastSave > l.lastSync) ? "gespeichert " + fmtTime(l.lastSave) : l.lastSync ? "abgeglichen " + fmtTime(l.lastSync) : "verbunden";
  }
  function sectionHtml(){
    if(!APP) return "";
    const U = APP.ui || {};
    if(!available()){
      if(capNative()) return `<p class="${U.hint || ""}" style="margin:0">Diese APK hat die Datei-Erweiterung noch nicht. Am Computer <code>python setup_apps.py --update</code> ausführen, die APK neu bauen und installieren — dann kannst du Dateien hier dauerhaft verbinden.</p>`;
      return `<p class="${U.hint || ""}" style="margin:0">Dateien dauerhaft verbinden geht in der Android-App und in Chrome/Edge am Computer.</p>`;
    }
    const anyPerm = APP.slots.some(s => links[s.id] && links[s.id].needPerm);
    return `<div class="lnk-box">
      ${APP.slots.map(s => { const l = links[s.id]; return `<div class="lnk-row">
        <div class="lnk-main"><div class="lnk-lab">${s.label}${s.write ? "" : ' <span class="lnk-ro">nur lesen</span>'}</div>
          <div class="lnk-file">${l ? escL(l.name) : "—"}</div><div class="lnk-st ${l && (l.error || l.needPerm) ? "lnk-warn" : ""}">${escL(statusOf(l))}</div>
          ${s.write && l && l.apps ? `<div class="lnk-apps">${[["planung","Planung"],["tracking","Tracking"],["mobility","Mobility"]].map(([k,t]) => `<span class="${l.apps.includes(k) ? "on" : ""}">${l.apps.includes(k) ? "✓" : "–"} ${t}</span>`).join("")}</div>
            ${l.apps.length < 3 ? `<div class="lnk-help">Noch nicht alle Apps schreiben in diese Mappe. Öffne die fehlenden Apps und verbinde dort unter „Verbundene Dateien ▸ Planungsmappe ▸ Verbinden“ genau diese Datei (${escL(l.name)}).</div>` : `<div class="lnk-help">Alle drei Apps synchronisieren über diese Mappe.</div>`}` : ""}
          ${s.help && !(s.write && l) ? `<div class="lnk-help">${s.help}</div>` : ""}</div>
        <div class="lnk-btns">
          <button class="${U.btn || ""}" data-lnk="pick|${s.id}">${l ? "Ändern" : "Verbinden"}</button>
          ${s.write && !l ? `<button class="${U.btn || ""}" data-lnk="create|${s.id}">Neu anlegen</button>` : ""}
          ${l ? `<button class="${U.btn || ""}" data-lnk="unlink|${s.id}" aria-label="Verbindung trennen">Trennen</button>` : ""}
        </div></div>`; }).join("")}
      ${APP.slots.some(s => links[s.id]) ? `<div class="lnk-actions"><button class="${U.primary || ""}" data-lnk="sync">${anyPerm ? "Zugriff erneuern & abgleichen" : "Jetzt abgleichen"}</button>${links.mappe ? `<button class="${U.btn || ""}" data-lnk="save">In Mappe speichern</button>` : ""}</div>` : ""}
      <p class="lnk-help" style="margin:8px 0 0">Die Planungsmappe ist eine gemeinsame Excel-Datei für Planung, Tracking und Mobility. Jede App schreibt nach Änderungen automatisch nur ihre eigenen Blätter hinein und liest beim Öffnen, was die anderen Apps eingetragen haben. Verbinde in allen drei Apps dieselbe Datei.</p>
    </div>`;
  }
  const escL = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  function refresh(){ if(!APP) return; document.querySelectorAll("[data-lnk-section]").forEach(el => { el.innerHTML = sectionHtml(); }); if(APP && APP.onStatus) APP.onStatus(); }
  function toast(msg){
    let t = document.getElementById("lnkToast");
    if(!t){ t = document.createElement("div"); t.id = "lnkToast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 3800);
  }
  function injectCss(){
    if(document.getElementById("lnkCss")) return;
    const st = document.createElement("style"); st.id = "lnkCss";
    st.textContent = `.lnk-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid rgba(127,127,127,.2)}
      .lnk-main{flex:1;min-width:180px}.lnk-lab{font-weight:700;font-size:14px}.lnk-ro{font-weight:500;font-size:11px;opacity:.7;border:1px solid rgba(127,127,127,.4);border-radius:5px;padding:0 5px;margin-left:4px}
      .lnk-file{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}.lnk-st{font-size:12px;opacity:.75}.lnk-warn{color:#B23A2E;opacity:1;font-weight:600}
      .lnk-apps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}.lnk-apps span{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;border:1px solid rgba(127,127,127,.35);opacity:.6}.lnk-apps span.on{opacity:1;background:#2E6F72;border-color:#2E6F72;color:#fff}
      .lnk-help{font-size:12px;opacity:.7;line-height:1.45;margin-top:3px}.lnk-btns{display:flex;gap:6px;flex-wrap:wrap}.lnk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
      #lnkToast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#191C18;color:#FAFAF7;padding:10px 16px;border-radius:10px;font:600 13.5px/1.35 system-ui,sans-serif;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
      #lnkToast.on{opacity:1}`;
    document.head.appendChild(st);
  }
  document.addEventListener("click", async e => {
    const b = e.target.closest && e.target.closest("[data-lnk]"); if(!b || !APP) return;
    e.preventDefault(); e.stopPropagation();
    const [act, slot] = b.getAttribute("data-lnk").split("|");
    try{
      if(act === "pick" || act === "create"){
        await pick(slot, act === "create");
        const s = APP.slots.find(x => x.id === slot);
        if(s && s.write){ links[slot].lastHash = null; links[slot].othersHash = null; }
        refresh(); await sync(true);
      } else if(act === "unlink"){
        if(!confirm("Verbindung trennen? Die Datei selbst bleibt unverändert.")) return;
        const l = links[slot]; delete links[slot]; store();
        try{ if(l && l.backend === "native") await P().release({ uri:l.uri }); }catch(_){}
        refresh();
      } else if(act === "sync"){ await sync(true); }
      else if(act === "save"){ busy = true; try{ if(await doSave(false)) toast("In die Mappe gespeichert"); } finally{ busy = false; refresh(); } }
    }catch(err){ const m = err && (err.message || err.name) || String(err); if(!/cancel|abort/i.test(m)) toast(m); }
  }, true);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && APP && Object.keys(links).length) sync(false); });

  return {
    init(app){ APP = app; load(); injectCss(); refresh(); if(Object.keys(links).length) sync(false); else ready = true; },
    changed, sync: () => sync(true), saveNow: async () => { if(!links.mappe) return false; busy = true; try{ return await doSave(false); } finally{ busy = false; refresh(); } },
    linked: () => !!links.mappe, available, sectionHtml, refresh, toast
  };
})();

/* ---- Tracking ↔ Planungsmappe ---- */
const TRACK_LINK={
  key:"tracking", ownFirst:false, saveDelay:2000,
  slots:[{id:"mappe",label:"Planungsmappe",write:true,suggest:"planungsmappe.xlsx",help:"Gemeinsame Datei aller drei Apps. Tracking schreibt hier Sessions, Kraft, Messungen, Gewicht, Wochen-Check und deine Ziel-Notizen hinein und liest die Wochenziele der Planung."},
         {id:"sensor",label:"Trainingsdatei (Sprung & Griffkraft)",write:false,help:"Am einfachsten dieselbe training-daten.json bzw. polar-all.json aus deinem Apps Script wie in der Planung — die App liest daraus den Block „sprung“. Eine einzelne Sensor-Datei (Excel, CSV, JSON) geht auch. Neue Sessions kommen ohne Doubletten dazu; das Bein erkennt die App am Namen („… left leg“ / „… right leg“)."}],
  ownSheets:()=>TRACK_SHEETS,
  readsSheets:()=>["Ziele","Phasen","Skala"],
  buildOwn:()=>buildWorkbook(),
  importOwn:wb=>{const {state,issues}=parseTrackingWb(wb);applyLoaded(state,null);if(issues.length)console.warn(issues);},
  consume:wb=>{if(!wb.Sheets["Ziele"]&&!wb.Sheets["Phasen"])return "";try{GOALS=parsePlanWb(wb,"Planungsmappe");lsSet(LS_GOALS,GOALS);const sy=reconcileNotes();return "Wochenziele aktualisiert"+(sy?` (${sy} Notiz(en) synchron)`:"");}catch(e){return "";}},
  consumeInput:(slot,wb,name)=>{if(slot!=="sensor")return "";const msg=[];
    if(wb.__json!==undefined){const g=gripSensorSessions(wb.__json);if(g.length){const r=mergeGrip(g);if(r.added)msg.push(r.added+" neue Griffkraft-Einheit"+(r.added===1?"":"en"));}
      let jw=null;try{jw=jumpJsonToWb(wb.__json);}catch(_){}if(jw){const r=mergeJump(parseJumpWb(jw,name));if(r.added)msg.push(r.added+" neue Sprung-Session"+(r.added===1?"":"s"));}}
    else{const r=mergeJump(parseJumpWb(wb,name));if(r.added)msg.push(r.added+" neue Sprung-Session"+(r.added===1?"":"s"));}
    if(msg.length)persist();return msg.join(" · ");},
  isDirty:()=>!!S.meta.dirty,
  markClean:()=>{S.meta.dirty=false;S.meta.lastSaved=Date.now();persist(false);},
  afterChange:()=>render(),
  ui:{btn:"btn small",primary:"btn primary small",hint:"hint"}
};
(async function boot(){
  if(fsSupported){try{const h=await idb("readonly",st=>st.get("dir"));if(h)dirHandle=h;}catch(e){}}
  if(typeof XLSX==="undefined")toast("Excel-Bibliothek nicht geladen — Internetverbindung prüfen");
  render();LINK.init(TRACK_LINK);})();

</script>
